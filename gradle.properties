# --- Gradle daemon ------------------------------------------------------------
org.gradle.jvmargs=-Xmx3G
# KEEP THIS FALSE. Stonecutter rewrites the shared src/ tree in place when it
# switches between version nodes, so configuring/executing :26.1.2 and :26.2 in
# parallel would let two nodes read and rewrite the same source files at once.
# This is not a pre-emptive guess about a hypothetical race: the nodes genuinely
# share one physical source tree, so do not "optimise" this back on.
org.gradle.parallel=false
# IntelliJ + Loom are not configuration-cache clean yet.
# https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# NOTE: org.gradle.java.home is deliberately NOT set here -- an absolute path to
# one machine's JDK makes the build unrunnable everywhere else. The Gradle daemon
# runs on the JVM described by gradle/gradle-daemon-jvm.properties (Java 25) and
# compilation uses the java toolchain declared in build.gradle.kts. See README
# for the untracked local override if your launcher JVM is too old to start.

# --- Mod metadata (shared across every version node) --------------------------
mod.id=skyprism
mod.name=SkyPrism
mod.group=com.skyprism
mod.version=1.0.3

# --- Toolchain / deps shared across every version node ------------------------
# Per-node versions (fabric_api_version) live in versions/<mc>/gradle.properties.
# Pinned to an exact Loom release, not the floating 1.17-SNAPSHOT, so two builds
# on different days cannot silently differ.
loom_version=1.17.20
loader_version=0.19.3
junit_version=5.14.4
# Supplies org.apiguardian.api.API$Status, which JUnit annotates its API with but
# does not expose on the consumer compile classpath. Must match JUnit's own.
apiguardian_version=1.1.2
